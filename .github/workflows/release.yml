name: Release

# Manual release build. Run it from the Actions tab with the version to publish.
# It builds the portable ZIP and the Velopack installer on a Windows runner and
# uploads them to a draft GitHub Release for review. Publish the draft by hand
# once you have smoke-tested the installer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part version to release, for example 0.5.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Test
        run: dotnet test .\tests\WinThunar.FileOps.Tests\WinThunar.FileOps.Tests.csproj --configuration Release

      # Delta updates need the previous packages in the output folder.
      - name: Download previous release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:GITHUB_TOKEN
          --outputDir .\artifacts\installer
        continue-on-error: true

      - name: Build ZIP and installer
        shell: pwsh
        run: .\scripts\Publish-Release.ps1 -Version '${{ inputs.version }}'

      - name: Upload to a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --outputDir .\artifacts\installer
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:GITHUB_TOKEN
          --releaseName "WinThunar ${{ inputs.version }}"
          --tag v${{ inputs.version }}

      - name: Upload portable ZIP and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload v${{ inputs.version }}
          .\artifacts\WinThunar-${{ inputs.version }}-win-x64.zip
          .\artifacts\WinThunar-${{ inputs.version }}-win-x64.zip.sha256
          --clobber
