name: Bug report
description: Something in WinThunar does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. If a file operation lost or damaged data, please say so
        in the summary; those reports are handled first.
  - type: input
    id: version
    attributes:
      label: WinThunar version
      description: Shown in Help > About, or in the name of the ZIP or installer you downloaded.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - MSI installer (just me)
        - MSI installer (everyone)
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder on a network drive
        2. Select several files
        3. Press Ctrl+C, then Ctrl+V in the other pane
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, whether the files are on NTFS, a network share or a removable drive, and any plugin you have enabled.
