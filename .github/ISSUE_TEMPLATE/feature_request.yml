name: Feature request
description: Suggest an improvement or a Thunar behavior that is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not just the feature. Mention how Thunar or Explorer handles it today if you know.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like WinThunar to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: For example a custom action or a plugin manifest.
